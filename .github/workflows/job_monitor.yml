name: Job Monitor

on:
  schedule:
    # 9:00 AM UTC = 5:00 AM ET (adjust if you prefer a different time)
    - cron: "0 9 * * 1"   # Every Monday
    - cron: "0 9 * * 3"   # Every Wednesday
  workflow_dispatch:        # Allow manual triggering from GitHub UI
    inputs:
      force_first_run:
        description: "Force first-run mode (include all currently posted jobs)"
        required: false
        default: "false"
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # Needed to commit seen_jobs.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run job monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_FIRST_RUN: ${{ inputs.force_first_run || 'false' }}
        run: python job_monitor.py

      - name: Commit updated seen_jobs.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "No changes to seen_jobs.json"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
